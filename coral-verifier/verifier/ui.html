<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="__VERSION__">
<title>Coral Guard</title>
<style>
/* Home Assistant look and feel (ingress does not inject the HA theme): HA variable names and default palette, light/dark by prefers-color-scheme */
:root{--primary-color:#03a9f4;--dark-primary-color:#0277bd;--accent-color:#ff9800;--primary-text-color:#212121;--secondary-text-color:#727272;
 --card-background-color:#ffffff;--primary-background-color:#fafafa;--divider-color:rgba(0,0,0,.12);--error-color:#db4437;--success-color:#2e7d32;--warning-color:#b26a00;
 --chip-background-color:rgba(0,0,0,.06);--app-header-background-color:#03a9f4;--app-header-text-color:#ffffff;--ha-card-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
 --person:#ef4444;--vehicle:#3b82f6;--animal:#22c55e}
@media (prefers-color-scheme:dark){:root{--primary-color:#03a9f4;--dark-primary-color:#0288d1;--accent-color:#ff9800;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;
 --card-background-color:#1c1c1c;--primary-background-color:#111111;--divider-color:rgba(225,225,225,.12);--error-color:#ef5350;--success-color:#66bb6a;--warning-color:#ffb74d;
 --chip-background-color:rgba(255,255,255,.1);--app-header-background-color:#1c1c1c;--app-header-text-color:#e1e1e1;--ha-card-shadow:none}}
:root{--bg:var(--primary-background-color);--card:var(--card-background-color);--fg:var(--primary-text-color);--mut:var(--secondary-text-color);--line:var(--divider-color);
 --acc:var(--primary-color);--ok:var(--success-color);--bad:var(--error-color);--warn:var(--warning-color);--chip:var(--chip-background-color)}
*{box-sizing:border-box}
[hidden]{display:none!important}                       /* a class with its own display (.more, .follow) must never override the hidden attribute */
body{margin:0;font:14px/1.45 Roboto,Noto,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
header{background:var(--app-header-background-color);color:var(--app-header-text-color);position:sticky;top:0;z-index:5;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.appbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px}
.appbar svg.mark{width:30px;height:30px;flex:none}
h1{font-size:20px;font-weight:500;margin:0;flex:1;white-space:nowrap}
.appbar .mut{color:inherit;opacity:.8}
nav{display:flex;overflow-x:auto;padding:0 8px}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:inherit;opacity:.75;padding:12px 16px;font:500 14px Roboto,system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-bottom-color:var(--accent-color)}
nav button:hover{opacity:1}
h2{font-size:16px;font-weight:500;margin:20px 0 8px}h3{font-size:14px;font-weight:500;margin:16px 0 6px}
button{border:1px solid var(--line);background:transparent;color:var(--fg);padding:8px 16px;border-radius:18px;cursor:pointer;font:500 14px Roboto,system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;min-height:36px}
button:hover{background:var(--chip)}
button.on{background:var(--dark-primary-color);color:#fff;border-color:var(--dark-primary-color)}
button svg,.icon{width:20px;height:20px;fill:currentColor;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;align-items:center}
select,input,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;min-width:0;min-height:36px}
main{padding:0 16px 24px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card,.kpi,table,svg.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--ha-card-shadow)}
.card{padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--primary-color)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .cam{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:16px;padding:2px 10px;font-size:12px;line-height:20px}
.chip.motion{color:var(--accent-color)}tr.mot td{color:var(--accent-color);font-weight:500}
.chip.confirmed,.chip.correct{color:var(--ok)}.chip.vetoed,.chip.false_alarm{color:var(--bad)}.chip.aborted,.chip.stale,.chip.wrong_class,.chip.missed{color:var(--warn)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.th{position:relative;background:#0003;border-radius:8px;overflow:hidden;align-self:start}
.th img,.big img{width:100%;height:auto;display:block}
.th b{position:absolute;left:3px;bottom:2px;font-size:10px;font-weight:500;background:#000a;color:#fff;border-radius:4px;padding:0 4px}
.ov{position:absolute;inset:0;pointer-events:none}
.bx{position:absolute;border:2px solid #fff;box-sizing:border-box}
.bl{position:absolute;left:-2px;top:0;transform:translateY(-100%);font-size:10px;line-height:1.2;color:#fff;padding:0 3px;white-space:nowrap;border-radius:3px 3px 3px 0}
.th .bl{font-size:8px;transform:none}
.big{position:relative;background:#0003;border-radius:10px;overflow:hidden}
#detail{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:12px 16px 32px;display:none}
#detail.on{display:block}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{border-collapse:separate;border-spacing:0;width:100%;overflow:hidden}
td,th{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;font-size:13px;white-space:nowrap}
th{font-weight:500;color:var(--mut)}
th.s{cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--chip)}
.scroll{overflow-x:auto}
.lbl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
textarea{width:100%;min-height:56px;margin-top:10px}
.more{display:block;margin:16px auto}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* filter menu (port of the owner's own pattern: outlined button, radio groups, dot + choices in words) */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.fwrap{position:relative}
.fwrap>button{border:1px solid var(--line);position:relative}
.fdot{width:8px;height:8px;border-radius:50%;background:var(--primary-color)}
.fstate{font-size:13px;color:var(--mut)}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:12;min-width:240px;max-height:70vh;overflow:auto;padding:6px 0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.menu .ml{font-size:12px;color:var(--mut);padding:6px 14px 2px}
.menu button{display:flex;align-items:center;gap:8px;border:0;background:none;color:inherit;text-align:left;justify-content:flex-start;padding:8px 14px;border-radius:0;min-height:36px;width:100%}
.menu button:hover,.menu button:focus-visible{background:var(--chip);outline:none}
.menu .tick{display:inline-flex;width:18px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.menu label.date{display:grid;gap:2px;padding:0 14px 6px}
.menu input[type=date]{min-height:40px}
/* validate */
.vq{font-size:28px;font-weight:500;margin:18px 0 4px;line-height:1.2}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.vbtns button{justify-content:center;padding:20px 10px;font-size:20px;border-radius:28px;min-height:64px}
.vbtns .good{background:var(--dark-primary-color);color:#fff;border-color:var(--dark-primary-color);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.vbtns .wrong{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.vbtns button svg{width:26px;height:26px}
.vsub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.prog{font-weight:500}
.follow{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:6;box-shadow:0 -2px 6px rgba(0,0,0,.15)}
.follow[hidden]{display:none}
/* dashboard */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:8px 0}
.kpi{padding:14px 16px}
.kpi b{display:block;font-size:30px;font-weight:400;line-height:1.1}.kpi span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pbar{display:inline-block;width:80px;height:8px;background:var(--chip);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
.pbar i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0;font-size:12px;color:var(--mut)}
svg.chart{width:100%;height:auto}
svg.chart text{fill:var(--mut);font-size:9px}
@media (max-width:520px){.vbtns button{font-size:17px}.vq{font-size:23px}.appbar{height:52px}}
.chip.auto{color:var(--acc)}
.vswipe{display:none}
/* phones: question, one frame at a time (swipe for the others) and the answer buttons fixed at the bottom, all on one screen */
@media (max-width:600px){
  #vaView .bar{padding:6px 12px}
  #vBody{padding:0 12px 150px}
  .vq{font-size:21px;margin:8px 0 2px}
  #vaView .frames{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;-webkit-overflow-scrolling:touch;margin-top:8px}
  #vaView .frames>div{flex:0 0 100%;scroll-snap-align:center}
  .vswipe{display:block;text-align:center;margin-top:4px}
  .vbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 6px rgba(0,0,0,.15);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .vbar .vbtns{margin:0;gap:10px}
  .vbar .vbtns button{padding:10px;min-height:54px;font-size:18px}
  .vbar .vsub{margin:6px 0 0;justify-content:center}
  .vbar .vsub button{min-height:32px;padding:4px 12px;font-size:13px}
  #vNote{min-height:40px}
}
</style>
</head>
<body>
<header>
<div class="appbar"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10.2 4.6-1.5 8-5.2 8-10.2V5z" fill="#ff7f50" stroke="#d65c34" stroke-width=".9" stroke-linejoin="round"/><circle cx="11.4" cy="10.6" r="3.9" fill="#ff7f50" stroke="#fff" stroke-width="1.9"/><circle cx="11.4" cy="10.6" r="1.25" fill="#fff"/><path d="m14.2 13.4 3 3" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>
<h1>Coral Guard <span class="mut" id="ver">v__VERSION__</span></h1><span class="mut" id="stat"></span></div>
<nav role="tablist"><button id="tEv" class="on" role="tab">Events</button><button id="tVa" role="tab">Validate</button><button id="tRe" role="tab">Reviewed</button><button id="tSu" role="tab">Summary</button></nav>
</header>

<div id="evView">
  <div class="bar"><div id="evBar"></div></div>
  <main><div class="grid" id="grid"></div><button class="more" id="more" hidden>Load more</button><div class="empty" id="empty" hidden>No events</div></main>
</div>

<div id="vaView" hidden>
  <div class="bar"><div id="vaBar"></div><span class="prog" id="vProg"></span></div>
  <main id="vBody"></main>
</div>

<div id="reView" hidden>
  <div class="bar"><div id="reBar"></div><span id="rTot" class="mut"></span></div>
  <main>
    <section id="rDoSec"><h2 id="rDoH">Reviewed</h2><div class="empty" id="rDoEmpty" hidden>Nothing reviewed yet</div><div class="grid" id="rDoGrid"></div><button class="more" id="rDoMore" hidden>Load more</button></section>
  </main>
</div>

<div id="suView" hidden>
  <div class="bar"><div id="suBar"></div></div>
  <main id="suBody"></main>
</div>

<div id="follow" class="follow" hidden></div>
<div id="detail"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const API="v1/journal";                       // relative: works behind the Home Assistant ingress path prefix
const COL={person:"#ef4444",vehicle:"#3b82f6",animal:"#22c55e"};                 // consistent with the plugin
const CAT={confirmed:"#22c55e",vetoed:"#f59e0b",unflagged:"#3b82f6",other:"#9ca3af"};
let TAB="ev";
async function j(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(r.status+" "+url);return r.json()}
const post=(url,obj)=>j(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
const fmtT=ms=>ms?new Date(ms).toLocaleString([],{dateStyle:"short",timeStyle:"medium"}):"-";
const fmtD=(a,b)=>{if(!b)return"ongoing";let s=Math.max(0,Math.round((b-a)/1000));return s>=3600?(s/3600).toFixed(1)+" h":s>=60?Math.round(s/60)+" min":s+" s"};
const pct=v=>v==null?"-":Math.round(v*100)+"%";
const eid=encodeURIComponent;
const dn=m=>m.display_name||String(m.camera||"").replace(/_\d+$/,"")||m.camera;                // display name, fallback: the id without a trailing _<digits>
const IC={check:"M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z",filter:"M6,13H18V11H6M3,6V8H21V6M10,18H14V16H10V18Z",close:"M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z",
 next:"M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z",prev:"M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"};
function icon(name){const NS="http://www.w3.org/2000/svg",s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("aria-hidden","true");const p=document.createElementNS(NS,"path");p.setAttribute("d",IC[name]);s.appendChild(p);return s}
function btn(cls,text,ic,fn){const b=E("button",cls);if(ic)b.appendChild(icon(ic));b.appendChild(document.createTextNode(text));b.onclick=fn;return b}

/* ---------- boxes ---------- */
function mark(d){const s=d.second_look;if(s==="rejected")return"✗";if(d.second_look_doubt||s==="not_found"||s==="not_upgraded"||s==="skipped")return"?";if(s==="confirmed"||s==="lowered")return"✓";return""}
function boxLayer(dets,focus){                                                // focus: group to highlight, others are dimmed ("none" dims all)
  const o=E("div","ov");
  for(const d of dets||[]){const [a,b,c,e]=d.box;const col=d.second_look==="rejected"?"#9ca3af":(COL[d.group]||"#fff");
    const r=E("div","bx");if(focus&&d.group!==focus)r.style.opacity=".3";r.style.left=(a*100)+"%";r.style.top=(b*100)+"%";r.style.width=((c-a)*100)+"%";r.style.height=((e-b)*100)+"%";
    r.style.borderColor=col;if(d.weak||d.second_look==="rejected"||d.second_look_doubt)r.style.borderStyle="dashed";
    const t=E("span","bl",(d.cls||"")+" "+Number(d.score).toFixed(2)+(mark(d)?" "+mark(d):""));t.style.background=col;r.appendChild(t);o.appendChild(r)}
  return o}
function frameBox(id,f,cls,label,focus){
  const w=E("div",cls);const img=E("img");img.loading="lazy";img.src=`${API}/${eid(id)}/${f.name}.jpg`;img.alt=f.name;w.appendChild(img);
  if(label)w.appendChild(E("b","",label));
  j(`${API}/${eid(id)}/${f.name}.json`).then(s=>w.appendChild(boxLayer(s.detections,focus))).catch(()=>{});return w}
/* 0.3.19: occupancy vs motion time and still releases (absent on older episodes) */
function fmtS(s){s=Math.max(0,Math.round(Number(s)||0));return s<60?s+" s":Math.floor(s/60)+" min"+(s%60?" "+(s%60)+" s":"")}
function motionText(m){const o=m&&m.motion;if(!o)return null;const n=(v,w)=>v?` \u00b7 ${v} ${w}${v>1?"s":""}`:"";
  return `occupied ${fmtS(o.occupied_s)} \u00b7 motion ${fmtS(o.motion_s)}`+n(o.still_releases,"still release")+n(o.reraises,"re-raise")}
function isMotionEv(t){return /^motion (released|re-raised)/.test(t||"")}
function chips(m){const c=E("div","chips");c.appendChild(E("span","chip "+(m.outcome||""),m.outcome||m.status));
  (m.groups||[]).forEach(g=>c.appendChild(E("span","chip",g)));c.appendChild(E("span","chip",m.mode+"/"+m.kind));if(m.motion&&m.motion.still_releases)c.appendChild(E("span","chip motion","still release"+(m.motion.reraises?" + re-raise":"")));if(m.label)c.appendChild(E("span","chip "+m.label,m.label));if(m.auto)c.appendChild(E("span","chip auto","auto-validated"));return c}
function card(m){
  const c=E("div","card");const top=E("div","top");top.appendChild(E("span","cam",dn(m)));top.appendChild(E("span","mut",fmtD(m.start_ms,m.end_ms)));c.appendChild(top);
  c.appendChild(E("div","mut",fmtT(m.start_ms)));if(m.motion&&m.motion.motion_s!==m.motion.occupied_s)c.appendChild(E("div","mut",motionText(m)));c.appendChild(chips(m));
  const t=E("div","thumbs");for(const role of["first","best","last"]){const f=m.frames.find(x=>x.role===role);if(f)t.appendChild(frameBox(m.id,f,"th",role))}
  c.appendChild(t);c.onclick=()=>openDetail(m.id);return c}
function framesOf(m){const order=["first","best","last"];return[...order.map(r=>m.frames.find(f=>f.role===r)).filter(Boolean),...m.frames.filter(f=>f.role==="snapshot")]}

/* ---------- events tab ---------- */
let offset=0,total=0;const PAGE=24;
async function load(reset){
  if(reset){offset=0;$("#grid").replaceChildren()}
  const p=fparams("ev");p.set("limit",PAGE);p.set("offset",offset);
  try{const r=await j(`${API}?${p}`);total=r.total;r.items.forEach(m=>$("#grid").appendChild(card(m)));offset+=r.items.length;
    more("#more",r.items.length,PAGE,offset,total);$("#empty").hidden=total>0;$("#stat").textContent=total+" events"}catch(e){$("#stat").textContent="error: "+e.message}}
async function cams(){try{const s=await j(`${API}/summary`);CAMS=s.cameras.slice().sort((a,b)=>dn(a).localeCompare(dn(b)))}catch(e){}}

/* ---------- detail (also used to change a label) ---------- */
async function openDetail(id){
  const m=await j(`${API}/${eid(id)}`);const d=$("#detail");d.replaceChildren();d.classList.add("on");
  const back=E("button","","Back");back.onclick=()=>{d.classList.remove("on");refresh()};d.appendChild(back);
  d.appendChild(E("h2","",dn(m)+" - "+fmtT(m.start_ms)));d.appendChild(E("div","mut",`${fmtD(m.start_ms,m.end_ms)}  id ${m.id}`+(m.note?"  note: "+m.note:"")));if(motionText(m))d.appendChild(E("div","mut",motionText(m)));d.appendChild(chips(m));
  const fr=E("div","frames");const fs=framesOf(m);
  for(const f of fs){const col=E("div");col.appendChild(frameBox(m.id,f,"big",null));col.appendChild(E("div","mut",f.role+"  "+fmtT(f.t_ms)));fr.appendChild(col)}
  d.appendChild(fr);
  const note=E("textarea");note.placeholder="Note";note.value=m.label_note||"";
  const lb=E("div","lbl");for(const l of["correct","false_alarm","missed","wrong_class"]){const b=E("button",l===m.label?"on":"",l.replace("_"," "));b.onclick=async()=>{
    await post(`${API}/${eid(id)}/label`,{label:l,note:note.value||null});openDetail(id)};lb.appendChild(b)}
  d.appendChild(E("h3","","Label"));d.appendChild(lb);d.appendChild(note);
  d.appendChild(E("h3","","Timeline"));const tl=E("table");for(const e of m.timeline||[]){const r=tl.insertRow();if(isMotionEv(e.text))r.className="mot";r.insertCell().textContent=fmtT(e.t_ms);r.insertCell().textContent=e.text}d.appendChild(tl);
  d.appendChild(E("h3","","Detections"));const dt=E("div","scroll");d.appendChild(dt);
  const tb=E("table");const hr=tb.insertRow();["frame","class","group","score","flags"].forEach(x=>{const c=document.createElement("th");c.textContent=x;hr.appendChild(c)});dt.appendChild(tb);
  for(const f of fs){j(`${API}/${eid(id)}/${f.name}.json`).then(s=>{for(const x of s.detections){const r=tb.insertRow();
    r.insertCell().textContent=f.name;r.insertCell().textContent=x.cls;r.insertCell().textContent=x.group;r.insertCell().textContent=x.score+(x.first_score!=null?" (was "+x.first_score+")":"");
    r.insertCell().textContent=[x.weak&&"weak",x.masked&&"masked",x.second_look,x.second_look_doubt&&"doubt"].filter(Boolean).join(", ")}})}}

/* ---------- validate (annotation mode): ONE plain question per event, the server derives it (item.question) ---------- */
const V={cur:null,pre:null,hist:[],remaining:0,last:null};
function vq(after){const p=fparams("va");if(after)p.set("after",after);return p}
const vFetch=after=>j(`${API}/next?${vq(after)}`);
function vPrefetch(m){V.pre=null;vFetch(m.id).then(n=>{V.pre={after:m.id,r:n};if(n.item)framesOf(n.item).forEach(f=>{new Image().src=`${API}/${eid(n.item.id)}/${f.name}.jpg`})}).catch(()=>{})}
async function vLoad(after,labelled){
  let r;
  if(after&&V.pre&&V.pre.after===after){r={...V.pre.r};if(labelled)r.remaining=Math.max(0,r.remaining-1)}else r=await vFetch(after);
  V.pre=null;
  if(!r.item&&after&&r.remaining>0)r=await vFetch(null);                      // reached the end: wrap around to the skipped ones
  V.remaining=r.remaining;V.cur=r.item;vRender();if(r.item)vPrefetch(r.item)}
function vRender(){
  const b=$("#vBody");b.replaceChildren();$("#vProg").textContent=V.remaining+" left";const m=V.cur;
  if(!m){b.appendChild(E("div","empty","Nothing left to review"));return}
  const q=m.question||{text:"Is this a real event?",group:null,yes:"correct",no:"false_alarm"};
  b.appendChild(E("div","vq",q.text));if((q.others||[]).length)b.appendChild(E("div","mut","Also: "+q.others.join(", ")));b.appendChild(E("div","mut",dn(m)+" - "+fmtT(m.start_ms)+" - "+fmtD(m.start_ms,m.end_ms)));
  const bar=E("div","vbar");                                                  // phones: fixed at the bottom, so question, frame and answer share one screen
  const row=E("div","vbtns");row.appendChild(btn("good","Yes (Y)","check",()=>vAnswer(true)));row.appendChild(btn("wrong","No (N)","close",()=>vAnswer(false)));bar.appendChild(row);
  const sub=E("div","vsub");sub.appendChild(btn("","Skip (S)","next",vSkip));sub.appendChild(btn("","Previous","prev",vBack));bar.appendChild(sub);b.appendChild(bar);
  const shown=framesOf(m).slice(0,3);
  const fr=E("div","frames");for(const [i,f] of shown.entries()){const col=E("div");col.appendChild(frameBox(m.id,f,"big",null,q.group||"none"));col.appendChild(E("div","mut",f.role+(shown.length>1?` (${i+1}/${shown.length})`:"")));fr.appendChild(col)}b.appendChild(fr);
  if(shown.length>1)b.appendChild(E("div","mut vswipe","swipe for the other frames"));
  const note=E("textarea");note.id="vNote";note.placeholder="Note (optional)";note.value=m.label_note||"";b.appendChild(note)}
async function vAnswer(yes){
  const m=V.cur;if(!m)return;const q=m.question,n=$("#vNote");const label=yes?q.yes:q.no;
  await post(`${API}/${eid(m.id)}/label`,{label,note:n&&n.value?n.value:null});
  V.hist.push(m.id);V.last={id:m.id,q,yes,note:n&&n.value?n.value:null};followUp();await vLoad(m.id,!m.label)}
function followUp(){                                                           // only after a No: "What is it?" refines the label of the event just answered
  const f=$("#follow");f.replaceChildren();const l=V.last;if(!l||l.yes){f.hidden=true;return}
  f.hidden=false;const vb=document.querySelector("#vaView .vbar");                 // phones: above the fixed answer bar, not over it
  f.style.bottom=vb&&getComputedStyle(vb).position==="fixed"?vb.offsetHeight+"px":"";f.appendChild(E("span","mut","What is it?"));
  for(const c of["person","vehicle","animal","nothing","other"]){const b=E("button","",c);b.onclick=async()=>{
    const wrong=["person","vehicle","animal"].includes(c)&&c!==l.q.group;
    await post(`${API}/${eid(l.id)}/label`,{label:wrong?"wrong_class":l.q.no,note:("is: "+c+(l.note?" - "+l.note:""))});f.hidden=true};f.appendChild(b)}
  const x=E("button","","\u2715");x.onclick=()=>{f.hidden=true};f.appendChild(x)}
function vSkip(){if(V.cur)vLoad(V.cur.id,false)}
async function vBack(){const id=V.hist.pop();if(!id)return;const m=await j(`${API}/${eid(id)}`);V.cur=m;V.pre=null;vRender();vPrefetch(m)}
document.addEventListener("keydown",e=>{
  if(TAB!=="va"||$("#detail").classList.contains("on")||/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||"")))return;
  const k=e.key.toLowerCase();if(k==="y")vAnswer(true);else if(k==="n")vAnswer(false);else if(k==="s"||k==="arrowright")vSkip();else if(k==="arrowleft")vBack()});

/* ---------- reviewed tab ---------- */
const R={do:{off:0}};
function more(sel,got,limit,off,total){$(sel).hidden=got<limit||off>=total||total===0}      // no button when the list is empty, short, or fully loaded
async function reLoad(kind,reset){                                             // the Reviewed list (what is left to review lives in Validate)
  const s=R[kind],grid=$("#rDoGrid"),my=s.seq=(s.seq||0)+1;if(reset){s.off=0;grid.replaceChildren()}
  const p=new URLSearchParams({limit:12,offset:s.off,labelled:"true"});
  for(const[k,v]of fparams("re",{label:true}))p.set(k,v);
  const r=await j(`${API}?${p}`);if(my!==s.seq)return;                       // a newer request replaced this one: never append stale items
  r.items.forEach(m=>grid.appendChild(card(m)));s.off+=r.items.length;
  more("#rDoMore",r.items.length,12,s.off,r.total);$("#rDoH").textContent="Reviewed ("+r.total+")";
  $("#rDoEmpty").hidden=r.total>0}                                              // the empty state is ONE message outside the grid
async function reAll(){reLoad("do",true);
  const t=$("#rTot");try{const s=await j(`${API}/summary?${sparams("re")}`);const x=s.totals;
    t.textContent=x.reviewed+" reviewed \u00b7 "+(x.auto_validated?x.auto_validated+" auto-validated \u00b7 ":"")+x.reviewable+" to review \u00b7 "+x.ongoing+" in progress"}catch(e){t.textContent=""}}

/* ---------- summary dashboard ---------- */
const SU={hours:168,sort:"precision",dir:1};
function kpi(label,value){const k=E("div","kpi");k.appendChild(E("b","",value));k.appendChild(E("span","",label));return k}
function bar(v){const w=E("span","pbar");const i=E("i");i.style.width=Math.round((v||0)*100)+"%";i.style.background=v==null?"transparent":v>=.9?"#22c55e":v>=.7?"#f59e0b":"#ef4444";w.appendChild(i);return w}
function chart(days){
  const NS="http://www.w3.org/2000/svg",W=Math.max(300,days.length*34),Hh=150,top=10,base=125,max=Math.max(1,...days.map(d=>d.total));
  const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${W} ${Hh}`);s.setAttribute("class","chart");
  const bw=Math.min(24,(W-20)/days.length-6);
  days.forEach((d,i)=>{let y=base;const x=14+i*((W-20)/days.length);
    for(const c of["confirmed","vetoed","unflagged","other"]){const h=(d[c]/max)*(base-top);if(!h)continue;y-=h;
      const r=document.createElementNS(NS,"rect");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",bw);r.setAttribute("height",h);r.setAttribute("fill",CAT[c]);r.setAttribute("rx",2);
      const t=document.createElementNS(NS,"title");t.textContent=d.day+" "+c+": "+d[c];r.appendChild(t);s.appendChild(r)}
    const v=document.createElementNS(NS,"text");v.setAttribute("x",x+bw/2);v.setAttribute("y",y-3);v.setAttribute("text-anchor","middle");v.textContent=d.total;s.appendChild(v);
    const l=document.createElementNS(NS,"text");l.setAttribute("x",x+bw/2);l.setAttribute("y",base+13);l.setAttribute("text-anchor","middle");l.textContent=d.day.slice(5);s.appendChild(l)});
  return s}
async function suLoad(){
  const p=sparams("su");p.set("tz",-new Date().getTimezoneOffset());
  const s=await j(`${API}/summary?${p}`),b=$("#suBody"),T=s.totals;b.replaceChildren();
  if(!T.events){b.appendChild(E("div","empty","No events in this period"));return}
  const k=E("div","kpis");k.appendChild(kpi("Events",T.events));k.appendChild(kpi("Reviewed",pct(T.closed?T.reviewed/T.closed:null)));
  k.appendChild(kpi("Precision",T.reviewed?pct(T.precision):"-"));k.appendChild(kpi("Auto-validated",T.auto_validated||0));k.appendChild(kpi("False alarms",T.false_alarm));k.appendChild(kpi("Missed",T.missed));if(T.still_releases!=null)k.appendChild(kpi("Still releases",T.still_releases+(T.reraises?" / "+T.reraises+" re-raised":"")));b.appendChild(k);
  if(!T.reviewed)b.appendChild(E("div","empty","Review events to see accuracy"));
  b.appendChild(E("h2","","Cameras"));
  const cols=[["camera","Camera"],["events","Events"],["reviewed","Reviewed"],["auto_validated","Auto"],["precision","Precision"],["false_alarm","False alarms"],["missed","Missed"],["confirmed","Confirmed"],["vetoed","Vetoed"],["unflagged","Unflagged"]];
  const rows=[...s.cameras].sort((a,c)=>{const x=a[SU.sort],y=c[SU.sort];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x<y?-1:x>y?1:0)*SU.dir});
  const tb=E("table"),hr=tb.insertRow();cols.forEach(([key,t])=>{const th=E("th","s",t+(SU.sort===key?(SU.dir>0?" ▲":" ▼"):""));th.onclick=()=>{SU.dir=SU.sort===key?-SU.dir:1;SU.sort=key;suLoad()};hr.appendChild(th)});
  for(const c of rows){const r=tb.insertRow();r.className="row";r.onclick=()=>{F.va.camera=F.re.camera=c.camera;hashWrite();V.hist=[];tab(c.reviewable>0?"va":"re")};   // unreviewed events: Validate, else Reviewed
    for(const[key]of cols){const td=r.insertCell();if(key==="camera")td.textContent=dn(c);else if(key==="precision"){td.appendChild(bar(c.precision));td.appendChild(document.createTextNode(c.reviewed?pct(c.precision):"-"))}else td.textContent=c[key]}}
  const sc=E("div","scroll");sc.appendChild(tb);b.appendChild(sc);
  b.appendChild(E("h2","","Categories"));const gt=E("table"),gh=gt.insertRow();["Category","Events","Precision"].forEach(x=>gh.appendChild(E("th","",x)));
  for(const g of s.groups){const r=gt.insertRow(),c0=r.insertCell(),dot=E("span","dot");dot.style.background=COL[g.group]||"#9ca3af";c0.appendChild(dot);c0.appendChild(document.createTextNode(g.group));
    r.insertCell().textContent=g.events;const pc=r.insertCell();if(g.reviewed){pc.appendChild(bar(g.precision));pc.appendChild(document.createTextNode(pct(g.precision)))}else pc.textContent="-"}
  const gs=E("div","scroll");gs.appendChild(gt);b.appendChild(gs);
  b.appendChild(E("h2","","Per day"));const lg=E("div","legend");for(const c of["confirmed","vetoed","unflagged","other"]){const sp=E("span","");const dot=E("span","dot");dot.style.background=CAT[c];sp.appendChild(dot);sp.appendChild(document.createTextNode(c==="other"?"aborted/other":c));lg.appendChild(sp)}
  b.appendChild(lg);b.appendChild(chart(s.days))}

/* ---------- filters: one outlined Filter button per tab, a menu of radio groups, state in the URL hash ---------- */
const TABS=["ev","va","re","su"];
const DEF={ev:"all",va:"all",re:"all",su:"7d"};                                        // default period per tab
const PER={"24h":["24 h",24],"7d":["7 days",168],"14d":["14 days",336],all:["All time",0]};
const LABELS={correct:"correct",false_alarm:"false alarm",missed:"missed",wrong_class:"wrong class"};
const F={};for(const t of TABS)F[t]={camera:"",category:"",outcome:"",label:"",period:DEF[t],from:"",to:""};
let CAMS=[];
function dayRange(f){if(f.from||f.to)return{from:f.from?new Date(f.from+"T00:00:00").getTime():0,to:f.to?new Date(f.to+"T23:59:59").getTime():0};
  const h=PER[f.period][1];return h?{from:Date.now()-h*3600e3,to:0}:{from:0,to:0}}
function sparams(t){const f=F[t],p=new URLSearchParams();if(f.camera)p.set("camera",f.camera);if(f.category)p.set("group",f.category);
  const r=dayRange(f);if(r.from)p.set("from",r.from);if(r.to)p.set("to",r.to);return p}
function fparams(t,o){const f=F[t],p=sparams(t);if(f.outcome)p.set("outcome",f.outcome);if(o&&o.label&&f.label)p.set("label",f.label);return p}
function summaryOf(t){const f=F[t],a=[];if(f.camera){const c=CAMS.find(x=>x.camera===f.camera);a.push(c?dn(c):f.camera)}
  if(f.category)a.push(f.category);if(f.outcome)a.push(f.outcome);if(f.label)a.push(LABELS[f.label]||f.label);
  if(f.from||f.to)a.push((f.from||"\u2026")+" \u2013 "+(f.to||"\u2026"));else if(f.period!==DEF[t])a.push(PER[f.period][0]);return a.join(" \u00b7 ")}
function groupsFor(t){const f=F[t],all=["","All"];
  const g=[{kind:"radio",id:"camera",label:"Camera",value:f.camera,options:[all,...CAMS.map(c=>[c.camera,dn(c)])]},
    {kind:"radio",id:"category",label:"Category",value:f.category,options:[all,["person","person"],["vehicle","vehicle"],["animal","animal"]]}];
  if(t!=="su")g.push({kind:"radio",id:"outcome",label:"Outcome",value:f.outcome,options:[all,["confirmed","confirmed"],["vetoed","vetoed"],["unflagged","unflagged"]]});
  if(t==="re")g.push({kind:"radio",id:"label",label:"Label",value:f.label,options:[all,...Object.entries(LABELS)]});
  g.push({kind:"radio",id:"period",label:"Period",value:f.from||f.to?"":f.period,options:Object.entries(PER).map(([k,v])=>[k,v[0]])});
  g.push({kind:"date",id:"from",label:"From",value:f.from},{kind:"date",id:"to",label:"To",value:f.to});
  if(summaryOf(t))g.push({kind:"action",id:"reset",label:"Reset"});return g}
function hashWrite(){const p=new URLSearchParams();p.set("t",TAB);for(const t of TABS)for(const k in F[t]){const d=k==="period"?DEF[t]:"";if(F[t][k]!==d)p.set(t+"."+k,F[t][k])}
  try{history.replaceState(null,"","#"+p)}catch(e){}}
function hashRead(){let p;try{p=new URLSearchParams(String(location.hash||"").replace(/^#/,""))}catch(e){return}
  for(const[k,v]of p){const m=/^(ev|va|re|su)\.(camera|category|outcome|label|period|from|to)$/.exec(k);if(!m)continue;
    if(m[2]==="period"&&!PER[v])continue;if((m[2]==="from"||m[2]==="to")&&!/^\d{4}-\d{2}-\d{2}$/.test(v))continue;F[m[1]][m[2]]=v}
  if(TABS.includes(p.get("t")))TAB=p.get("t")}
const MENUS={};
function filterMenu(t,mount){
  const wrap=E("div","toolbar"),w=E("div","fwrap"),btn=E("button",""),dot=E("span","fdot"),state=E("span","fstate"),menu=E("div","menu");
  btn.appendChild(icon("filter"));btn.appendChild(E("span","","Filter"));btn.appendChild(dot);dot.hidden=true;state.hidden=true;menu.hidden=true;
  btn.setAttribute("aria-haspopup","menu");btn.setAttribute("aria-expanded","false");menu.setAttribute("role","menu");menu.setAttribute("aria-label","Filter");
  w.appendChild(btn);w.appendChild(menu);wrap.appendChild(w);wrap.appendChild(state);mount.appendChild(wrap);
  let items=[],isOpen=false;
  const api={open:()=>isOpen,paint(){const s=summaryOf(t);dot.hidden=!s;state.hidden=!s;state.textContent=s;btn.title=s}};
  function changed(){hashWrite();api.paint();refreshTab(t)}
  function build(){menu.replaceChildren();items=[];
    groupsFor(t).forEach((g,i)=>{if(i>0)menu.appendChild(E("hr"));
      if(g.kind==="radio"){menu.appendChild(E("div","ml",g.label));for(const[v,l]of g.options){const b=E("button","");b.setAttribute("role","menuitemradio");b.setAttribute("tabindex","-1");
        b.setAttribute("aria-checked",g.value===v?"true":"false");const tk=E("span","tick");if(g.value===v)tk.appendChild(icon("check"));b.appendChild(tk);
        b.onclick=()=>{F[t][g.id]=v;if(g.id==="period"){F[t].from="";F[t].to=""}close(true);changed()};b.appendChild(E("span","",l));menu.appendChild(b);items.push(b)}}
      else if(g.kind==="date"){const lb=E("label","date");lb.appendChild(E("span","ml",g.label));const inp=E("input");inp.type="date";inp.value=g.value;inp.setAttribute("aria-label",g.label);
        inp.onchange=()=>{F[t][g.id]=inp.value;changed()};lb.appendChild(inp);menu.appendChild(lb);items.push(inp)}
      else{const b=E("button","");b.setAttribute("role","menuitem");b.setAttribute("tabindex","-1");b.appendChild(icon("close"));b.appendChild(E("span","",g.label));
        b.onclick=()=>{F[t]={camera:"",category:"",outcome:"",label:"",period:DEF[t],from:"",to:""};close(true);changed()};menu.appendChild(b);items.push(b)}})}
  function outside(e){if(!w.contains(e.target))close(false)}
  function open(){build();menu.hidden=false;isOpen=true;btn.setAttribute("aria-expanded","true");document.addEventListener("pointerdown",outside,true);
    (items.find(i=>i.getAttribute("aria-checked")==="true")||items[0]).focus()}
  function close(focusBtn){if(!isOpen)return;menu.hidden=true;isOpen=false;btn.setAttribute("aria-expanded","false");document.removeEventListener("pointerdown",outside,true);if(focusBtn)btn.focus()}
  btn.onclick=()=>isOpen?close(false):open();
  w.addEventListener("keydown",e=>{if(!isOpen)return;
    if(e.key==="Escape"){e.preventDefault();close(true);return}if(e.key==="Tab"){close(false);return}
    const at=items.indexOf(document.activeElement),n=items.length;
    const to=e.key==="ArrowDown"?(at+1)%n:e.key==="ArrowUp"?(at-1+n)%n:e.key==="Home"?0:e.key==="End"?n-1:-1;
    if(to>=0){e.preventDefault();items[to].focus()}});
  api.close=close;api.btn=btn;return api}
function refreshTab(t){if(t==="ev")load(true);else if(t==="va"){V.hist=[];V.pre=null;vLoad(null,false)}else if(t==="re")reAll();else suLoad();for(const k of TABS)MENUS[k]&&MENUS[k].paint()}

/* ---------- tabs ---------- */
const VIEWS={ev:"#evView",va:"#vaView",re:"#reView",su:"#suView"},BTN={ev:"#tEv",va:"#tVa",re:"#tRe",su:"#tSu"};
function tab(n){TAB=n;hashWrite();for(const k in VIEWS){$(VIEWS[k]).hidden=k!==n;$(BTN[k]).className=k===n?"on":""}
  if(n==="va"){V.pre=null;vLoad(null,false)}else if(n==="re")reAll();else if(n==="su")suLoad();else load(true)}
function refresh(){if(TAB==="ev")load(true);else if(TAB==="va")vLoad(null,false);else if(TAB==="re")reAll();else suLoad()}
for(const k in BTN)$(BTN[k]).onclick=()=>tab(k);
$("#more").onclick=()=>load(false);$("#rDoMore").onclick=()=>reLoad("do",false);
hashRead();
for(const t of TABS)MENUS[t]=filterMenu(t,$("#"+t+"Bar"));
cams().then(()=>{for(const t of TABS)MENUS[t].paint()});
tab(TAB);
</script>
